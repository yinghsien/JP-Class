<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大家的日本語 N5 單字卡</title>
  <style>
    :root {
      --primary-color: #e74c3c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-color: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    /* 控制面板 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      width: 100%;
      max-width: 520px;
    }

    select, button {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #f1f1f1;
    }

    .btn-reset {
      color: #c0392b;
      border-color: #f5b7b1;
    }

    .btn-reset:hover {
      background-color: #fadbd8;
    }

    /* 進度資訊列 */
    .info-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    /* 3D 卡片容器 */
    .card-container {
      width: 100%;
      max-width: 420px;
      height: 280px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      border: 2px solid #f0f0f0;
    }

    /* 正面視覺標記：已記住標籤 */
    .status-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #27ae60;
      color: white;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
      display: none;
    }

    /* 正面卡片內容 */
    .card-front .word {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .card-front .kana-sub {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 4px;
    }

    .card-front .romaji {
      font-size: 0.9rem;
      color: #888;
      font-style: italic;
      margin-bottom: 10px;
    }

    .card-front .hint {
      font-size: 0.8rem;
      color: #aaa;
      position: absolute;
      bottom: 15px;
    }

    /* 背面卡片內容 */
    .card-back {
      transform: rotateY(180deg);
      background-color: #fafafa;
    }

    .card-back .meaning {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .card-back .example-box {
      margin-top: 10px;
      background: #f0f4f8;
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
    }

    .card-back .example-jp {
      font-size: 0.95rem;
      color: #333;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    /* 例句關鍵字高亮 */
    .card-back .example-jp .highlight {
      color: #e74c3c;
      font-weight: bold;
      background-color: #fde8e8;
      padding: 0 3px;
      border-radius: 3px;
    }

    .card-back .example-cn {
      font-size: 0.85rem;
      color: #666;
    }

    /* 操作按鈕 */
    .action-buttons {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 420px;
      justify-content: center;
    }

    .btn-status {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .btn-forget {
      background-color: #e74c3c;
    }

    .btn-remember {
      background-color: var(--accent-color);
    }

    .audio-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .audio-btn:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>

  <header>
    <h1>大家的日本語 N5 單字卡</h1>
  </header>

  <!-- 控制面板 -->
  <div class="controls">
    <select id="bookSelect" onchange="updateLessonOptions()">
      <option value="1">初級一 (1-12課)</option>
      <option value="2">初級二 (13-25課)</option>
    </select>

    <select id="lessonSelect" onchange="loadVocab()">
      <!-- 自動生成 -->
    </select>

    <select id="filterSelect" onchange="renderCard()">
      <option value="all">全部單字</option>
      <option value="forgot">僅看：還沒記住</option>
      <option value="remembered">僅看：已經記住</option>
    </select>

    <button onclick="shuffleVocab()">🔀 隨機洗牌</button>
    <button class="btn-reset" onclick="resetLessonProgress()">🧹 重置本課</button>
  </div>

  <!-- 進度與計數器 -->
  <div class="info-bar">
    <span id="progressText">單字：0 / 0</span>
    <span id="rememberCount">已記住：0</span>
  </div>

  <!-- 3D 翻牌單字卡 -->
  <div class="card-container" onclick="flipCard()">
    <div class="card" id="flashcard">
      <!-- 正面 -->
      <div class="card-face card-front">
        <div class="status-badge" id="statusBadge">✅ 已記住</div>
        <button class="audio-btn" onclick="speakCurrentWord(event)" title="聽發音">🔊</button>
        
        <div class="word" id="frontWord">載入中...</div>
        <div class="kana-sub" id="frontKana"></div>
        <div class="romaji" id="frontRomaji"></div>
        <div class="hint">點擊卡片或按 Space 翻面</div>
      </div>

      <!-- 背面 -->
      <div class="card-face card-back">
        <button class="audio-btn" onclick="speakCurrentWord(event)" title="聽發音">🔊</button>
        
        <div class="meaning" id="backMeaning"></div>
        
        <div class="example-box">
          <div class="example-jp" id="backExampleJp"></div>
          <div class="example-cn" id="backExampleCn"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作按鈕 -->
  <div class="action-buttons">
    <button class="btn-status btn-forget" onclick="markWord(false)">❌ 還沒記住 (←)</button>
    <button class="btn-status btn-remember" onclick="markWord(true)">⭕ 已經記住 (→)</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzMW4846wXLCHCEcN1LfGv4Dq6hCPfmELT5PxulrJjC6ziI8sFzn4-eUPtc8Dtxh4SypA/exec";

    let rawVocabList = [];     // 儲存 API 載入的原始該課單字
    let currentVocabList = []; // 儲存經篩選模式處理後的單字列表
    let currentIndex = 0;
    let isFlipped = false;

    // 初始化課別下拉選單
    function updateLessonOptions() {
      const book = document.getElementById("bookSelect").value;
      const lessonSelect = document.getElementById("lessonSelect");
      lessonSelect.innerHTML = "";

      const start = book === "1" ? 1 : 13;
      const end = book === "1" ? 12 : 25;

      for (let i = start; i <= end; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `第 ${i} 課`;
        lessonSelect.appendChild(option);
      }

      loadVocab();
    }

    // 從 Google Apps Script API 載入當前課數單字
    async function loadVocab() {
      const selectedLesson = document.getElementById("lessonSelect").value;
      document.getElementById("frontWord").textContent = "載入中...";

      try {
        const response = await fetch(`${API_URL}?lesson=${selectedLesson}`);
        if (!response.ok) throw new Error(`HTTP 狀態碼: ${response.status}`);

        const data = await response.json();

        if (Array.isArray(data)) {
          rawVocabList = data.filter(item => item && String(item.lesson) === String(selectedLesson));
        } else {
          rawVocabList = [];
        }

        currentIndex = 0;
        renderCard();
      } catch (error) {
        console.error("載入失敗：", error);
        document.getElementById("frontWord").textContent = "載入失敗，請檢查網路";
      }
    }

    // 渲染當前卡片與套用篩選
    function renderCard() {
      const filterType = document.getElementById("filterSelect").value;

      // 篩選模式處理
      currentVocabList = rawVocabList.filter(item => {
        const isRemembered = localStorage.getItem(`vocab_status_${item.id}`) === "remembered";
        if (filterType === "remembered") return isRemembered;
        if (filterType === "forgot") return !isRemembered;
        return true; // all
      });

      if (currentVocabList.length === 0) {
        document.getElementById("frontWord").textContent = "無符合條件的單字";
        document.getElementById("frontKana").textContent = "";
        document.getElementById("frontRomaji").textContent = "";
        document.getElementById("backMeaning").textContent = "";
        document.getElementById("backExampleJp").textContent = "";
        document.getElementById("backExampleCn").textContent = "";
        document.getElementById("statusBadge").style.display = "none";
        updateProgress();
        return;
      }

      if (currentIndex >= currentVocabList.length) currentIndex = 0;
      const current = currentVocabList[currentIndex];

      // 卡片翻回正面
      const card = document.getElementById("flashcard");
      card.classList.remove("flipped");
      isFlipped = false;

      // 檢查並顯示視覺標記 (✅ 已記住)
      const isRemembered = localStorage.getItem(`vocab_status_${current.id}`) === "remembered";
      document.getElementById("statusBadge").style.display = isRemembered ? "block" : "none";

      // 填寫正面欄位
      document.getElementById("frontWord").textContent = current.word || "";
      document.getElementById("frontKana").textContent = current.kana || "";
      document.getElementById("frontRomaji").textContent = current.romaji || "";

      // 填寫背面欄位
      document.getElementById("backMeaning").textContent = current.meaning || "";

      // 背面例句關鍵字紅色高亮處理
      if (current.example) {
        let highlightedExample = current.example;
        if (current.word) {
          highlightedExample = highlightedExample.split(current.word).join(`<span class="highlight">${current.word}</span>`);
        }
        document.getElementById("backExampleJp").innerHTML = `例：${highlightedExample}`;
      } else {
        document.getElementById("backExampleJp").innerHTML = "";
      }

      document.getElementById("backExampleCn").textContent = current.example_meaning || "";

      updateProgress();
    }

    // 翻牌切換
    function flipCard() {
      if (currentVocabList.length === 0) return;
      const card = document.getElementById("flashcard");
      card.classList.toggle("flipped");
      isFlipped = !isFlipped;
    }

    // 洗牌功能
    function shuffleVocab() {
      if (currentVocabList.length <= 1) return;
      currentVocabList.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderCard();
    }

    // 語音發音
    function speakCurrentWord(event) {
      if (event) event.stopPropagation();
      if (currentVocabList.length === 0) return;

      const current = currentVocabList[currentIndex];
      const textToSpeak = current.kana || current.word;

      if (!textToSpeak) return;

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = "ja-JP";
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // 標記記憶狀態
    function markWord(remembered) {
      if (currentVocabList.length === 0) return;

      const current = currentVocabList[currentIndex];
      if (current && current.id) {
        localStorage.setItem(`vocab_status_${current.id}`, remembered ? "remembered" : "forgot");
      }

      if (currentIndex < currentVocabList.length - 1) {
        currentIndex++;
      } else {
        alert("目前的單字已瀏覽完畢！");
        currentIndex = 0;
      }

      renderCard();
    }

    // 重置本課紀錄
    function resetLessonProgress() {
      if (confirm("確定要重置這一課的所有記憶紀錄嗎？")) {
        rawVocabList.forEach(item => {
          if (item && item.id) {
            localStorage.removeItem(`vocab_status_${item.id}`);
          }
        });
        currentIndex = 0;
        renderCard();
      }
    }

    // 更新進度條與數據
    function updateProgress() {
      const total = currentVocabList.length;
      const currentNum = total > 0 ? currentIndex + 1 : 0;
      document.getElementById("progressText").textContent = `單字：${currentNum} / ${total}`;

      let rememberedCount = 0;
      rawVocabList.forEach(item => {
        if (item && item.id && localStorage.getItem(`vocab_status_${item.id}`) === "remembered") {
          rememberedCount++;
        }
      });
      document.getElementById("rememberCount").textContent = `已記住：${rememberedCount} / ${rawVocabList.length}`;
    }

    // 鍵盤快捷鍵綁定
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowLeft") {
        markWord(false);
      } else if (e.code === "ArrowRight") {
        markWord(true);
      }
    });

    // 初始載入
    updateLessonOptions();
  </script>
</body>
</html>
