<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大家的日本語 N5 學習卡</title>
  <style>
    :root {
      --primary-color: #e74c3c;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --accent-color: #27ae60;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 12px;
    }

    /* 模式切換按鈕 */
    .mode-switch {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    .mode-btn {
      padding: 8px 18px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid var(--primary-color);
      background: white;
      color: var(--primary-color);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--primary-color);
      color: white;
    }

    /* 控制面板 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      background: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      margin-bottom: 15px;
      width: 100%;
      max-width: 520px;
    }

    select, button {
      padding: 8px 12px;
      font-size: 0.95rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #f1f1f1;
    }

    .btn-reset {
      color: #c0392b;
      border-color: #f5b7b1;
    }

    .btn-reset:hover {
      background-color: #fadbd8;
    }

    /* 進度資訊列 */
    .info-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    /* 3D 卡片容器 */
    .card-container {
      width: 100%;
      max-width: 420px;
      height: 300px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      border: 2px solid #f0f0f0;
    }

    /* 正面視覺標記：已記住標籤 */
    .status-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #27ae60;
      color: white;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
      display: none;
    }

    /* 正面卡片內容 */
    .card-front .title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #2c3e50;
      word-break: break-word;
    }

    .card-front .formula-box {
      font-size: 1rem;
      color: #2980b9;
      background: #ebf5fb;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .card-front .kana-sub {
      font-size: 1.1rem;
      color: #444;
      margin-bottom: 4px;
    }

    .card-front .romaji {
      font-size: 0.9rem;
      color: #888;
      font-style: italic;
      margin-bottom: 10px;
    }

    .card-front .hint {
      font-size: 0.8rem;
      color: #aaa;
      position: absolute;
      bottom: 15px;
    }

    /* 背面卡片內容 */
    .card-back {
      transform: rotateY(180deg);
      background-color: #fafafa;
      overflow-y: auto;
    }

    .card-back .meaning {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #2c3e50;
    }

    .card-back .explanation-box {
      font-size: 0.88rem;
      color: #555;
      background: #fff8e7;
      padding: 8px 12px;
      border-left: 4px solid #f39c12;
      border-radius: 4px;
      margin-bottom: 10px;
      text-align: left;
      width: 100%;
    }

    .card-back .example-box {
      background: #f0f4f8;
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
    }

    .card-back .example-jp {
      font-size: 0.95rem;
      color: #333;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .card-back .example-jp .highlight {
      color: #e74c3c;
      font-weight: bold;
      background-color: #fde8e8;
      padding: 0 3px;
      border-radius: 3px;
    }

    .card-back .example-cn {
      font-size: 0.85rem;
      color: #666;
    }

    /* 操作按鈕 */
    .action-buttons {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 420px;
      justify-content: center;
    }

    .btn-status {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .btn-forget {
      background-color: #e74c3c;
    }

    .btn-remember {
      background-color: var(--accent-color);
    }

    .audio-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .audio-btn:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>

  <header>
    <h1>大家的日本語 N5 學習卡</h1>
    <!-- 模式切換：單字卡 vs 文法句型卡 -->
    <div class="mode-switch">
      <button id="modeVocab" class="mode-btn active" onclick="switchMode('vocab')">📝 單字卡</button>
      <button id="modeGrammar" class="mode-btn" onclick="switchMode('grammar')">📖 文法句型</button>
    </div>
  </header>

  <!-- 控制面板 -->
  <div class="controls">
    <select id="bookSelect" onchange="updateLessonOptions()">
      <option value="1">初級一 (1-12課)</option>
      <option value="2">初級二 (13-25課)</option>
    </select>

    <select id="lessonSelect" onchange="loadData()">
      <!-- 自動生成 -->
    </select>

    <select id="filterSelect" onchange="renderCard()">
      <option value="all">全部項目</option>
      <option value="forgot">僅看：還沒記住</option>
      <option value="remembered">僅看：已經記住</option>
    </select>

    <button onclick="shuffleData()">🔀 隨機洗牌</button>
    <button class="btn-reset" onclick="resetLessonProgress()">🧹 重置本課</button>
  </div>

  <!-- 進度與計數器 -->
  <div class="info-bar">
    <span id="progressText">項目：0 / 0</span>
    <span id="rememberCount">已記住：0</span>
  </div>

  <!-- 3D 翻牌卡片 -->
  <div class="card-container" onclick="flipCard()">
    <div class="card" id="flashcard">
      <!-- 正面 -->
      <div class="card-face card-front">
        <div class="status-badge" id="statusBadge">✅ 已記住</div>
        <button class="audio-btn" onclick="speakCurrentText(event)" title="聽發音">🔊</button>
        
        <div class="title" id="frontTitle">載入中...</div>
        <div class="formula-box" id="frontFormula" style="display: none;"></div>
        <div class="kana-sub" id="frontKana"></div>
        <div class="romaji" id="frontRomaji"></div>
        <div class="hint">點擊卡片或按 Space 翻面</div>
      </div>

      <!-- 背面 -->
      <div class="card-face card-back">
        <button class="audio-btn" onclick="speakCurrentText(event)" title="聽發音">🔊</button>
        
        <div class="meaning" id="backMeaning"></div>
        <div class="explanation-box" id="backExplanation" style="display: none;"></div>
        
        <div class="example-box">
          <div class="example-jp" id="backExampleJp"></div>
          <div class="example-cn" id="backExampleCn"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作按鈕 -->
  <div class="action-buttons">
    <button class="btn-status btn-forget" onclick="markItem(false)">❌ 還沒記住 (←)</button>
    <button class="btn-status btn-remember" onclick="markItem(true)">⭕ 已經記住 (→)</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzMW4846wXLCHCEcN1LfGv4Dq6hCPfmELT5PxulrJjC6ziI8sFzn4-eUPtc8Dtxh4SypA/exec";

    let currentMode = "vocab"; // 'vocab' 或 'grammar'
    let rawDataList = [];     
    let currentDataList = []; 
    let currentIndex = 0;
    let isFlipped = false;

    // 切換單字卡與文法卡模式
    function switchMode(mode) {
      if (currentMode === mode) return;
      currentMode = mode;

      document.getElementById("modeVocab").classList.toggle("active", mode === "vocab");
      document.getElementById("modeGrammar").classList.toggle("active", mode === "grammar");

      loadData();
    }

    // 初始化課別下拉選單
    function updateLessonOptions() {
      const book = document.getElementById("bookSelect").value;
      const lessonSelect = document.getElementById("lessonSelect");
      lessonSelect.innerHTML = "";

      const start = book === "1" ? 1 : 13;
      const end = book === "1" ? 12 : 25;

      for (let i = start; i <= end; i++) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `第 ${i} 課`;
        lessonSelect.appendChild(option);
      }

      loadData();
    }

    // 載入資料 (帶入 currentMode 參數)
    async function loadData() {
      const selectedLesson = document.getElementById("lessonSelect").value;
      document.getElementById("frontTitle").textContent = "載入中...";

      try {
        const response = await fetch(`${API_URL}?lesson=${selectedLesson}&type=${currentMode}`);
        if (!response.ok) throw new Error(`HTTP 狀態碼: ${response.status}`);

        const data = await response.json();

        if (Array.isArray(data)) {
          rawDataList = data.filter(item => item && String(item.lesson) === String(selectedLesson));
        } else {
          rawDataList = [];
        }

        currentIndex = 0;
        renderCard();
      } catch (error) {
        console.error("載入失敗：", error);
        document.getElementById("frontTitle").textContent = "載入失敗，請檢查網路";
      }
    }

    // 渲染當前卡片與套用篩選
    function renderCard() {
      const filterType = document.getElementById("filterSelect").value;

      currentDataList = rawDataList.filter(item => {
        const key = `${currentMode}_status_${item.id}`;
        const isRemembered = localStorage.getItem(key) === "remembered";
        if (filterType === "remembered") return isRemembered;
        if (filterType === "forgot") return !isRemembered;
        return true;
      });

      if (currentDataList.length === 0) {
        document.getElementById("frontTitle").textContent = "無符合條件的內容";
        document.getElementById("frontFormula").style.display = "none";
        document.getElementById("frontKana").textContent = "";
        document.getElementById("frontRomaji").textContent = "";
        document.getElementById("backMeaning").textContent = "";
        document.getElementById("backExplanation").style.display = "none";
        document.getElementById("backExampleJp").textContent = "";
        document.getElementById("backExampleCn").textContent = "";
        document.getElementById("statusBadge").style.display = "none";
        updateProgress();
        return;
      }

      if (currentIndex >= currentDataList.length) currentIndex = 0;
      const current = currentDataList[currentIndex];

      // 卡片翻回正面
      const card = document.getElementById("flashcard");
      card.classList.remove("flipped");
      isFlipped = false;

      // 檢查並顯示視覺標記
      const key = `${currentMode}_status_${current.id}`;
      const isRemembered = localStorage.getItem(key) === "remembered";
      document.getElementById("statusBadge").style.display = isRemembered ? "block" : "none";

      if (currentMode === "vocab") {
        // 單字卡渲染
        document.getElementById("frontTitle").textContent = current.word || "";
        document.getElementById("frontFormula").style.display = "none";
        document.getElementById("frontKana").textContent = current.kana || "";
        document.getElementById("frontRomaji").textContent = current.romaji || "";

        document.getElementById("backMeaning").textContent = current.meaning || "";
        document.getElementById("backExplanation").style.display = "none";

        if (current.example) {
          let highlightedExample = current.example;
          if (current.word) {
            highlightedExample = highlightedExample.split(current.word).join(`<span class="highlight">${current.word}</span>`);
          }
          document.getElementById("backExampleJp").innerHTML = `例：${highlightedExample}`;
        } else {
          document.getElementById("backExampleJp").innerHTML = "";
        }
      } else {
        // 文法句型卡渲染
        document.getElementById("frontTitle").textContent = current.title || "";
        
        if (current.formula) {
          document.getElementById("frontFormula").textContent = `接續：${current.formula}`;
          document.getElementById("frontFormula").style.display = "block";
        } else {
          document.getElementById("frontFormula").style.display = "none";
        }

        document.getElementById("frontKana").textContent = "";
        document.getElementById("frontRomaji").textContent = "";

        document.getElementById("backMeaning").textContent = current.meaning || "";

        if (current.explanation) {
          document.getElementById("backExplanation").innerHTML = `💡 <b>說明：</b>${current.explanation}`;
          document.getElementById("backExplanation").style.display = "block";
        } else {
          document.getElementById("backExplanation").style.display = "none";
        }

        document.getElementById("backExampleJp").innerHTML = current.example ? `例：${current.example}` : "";
      }

      document.getElementById("backExampleCn").textContent = current.example_meaning || "";

      updateProgress();
    }

    // 翻牌切換
    function flipCard() {
      if (currentDataList.length === 0) return;
      const card = document.getElementById("flashcard");
      card.classList.toggle("flipped");
      isFlipped = !isFlipped;
    }

    // 洗牌功能
    function shuffleData() {
      if (currentDataList.length <= 1) return;
      currentDataList.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderCard();
    }

    // 語音發音 (會自動抓單字或例句朗讀)
    function speakCurrentText(event) {
      if (event) event.stopPropagation();
      if (currentDataList.length === 0) return;

      const current = currentDataList[currentIndex];
      const textToSpeak = currentMode === "vocab" 
        ? (current.kana || current.word)
        : (current.example || current.title);

      if (!textToSpeak) return;

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = "ja-JP";
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // 標記記憶狀態
    function markItem(remembered) {
      if (currentDataList.length === 0) return;

      const current = currentDataList[currentIndex];
      if (current && current.id) {
        const key = `${currentMode}_status_${current.id}`;
        localStorage.setItem(key, remembered ? "remembered" : "forgot");
      }

      if (currentIndex < currentDataList.length - 1) {
        currentIndex++;
      } else {
        alert("目前的項目已瀏覽完畢！");
        currentIndex = 0;
      }

      renderCard();
    }

    // 重置本課紀錄
    function resetLessonProgress() {
      if (confirm(`確定要重置這一課的所有${currentMode === "vocab" ? "單字" : "文法"}記憶紀錄嗎？`)) {
        rawDataList.forEach(item => {
          if (item && item.id) {
            localStorage.removeItem(`${currentMode}_status_${item.id}`);
          }
        });
        currentIndex = 0;
        renderCard();
      }
    }

    // 更新進度條與數據
    function updateProgress() {
      const total = currentDataList.length;
      const currentNum = total > 0 ? currentIndex + 1 : 0;
      document.getElementById("progressText").textContent = `項目：${currentNum} / ${total}`;

      let rememberedCount = 0;
      rawDataList.forEach(item => {
        if (item && item.id && localStorage.getItem(`${currentMode}_status_${item.id}`) === "remembered") {
          rememberedCount++;
        }
      });
      document.getElementById("rememberCount").textContent = `已記住：${rememberedCount} / ${rawDataList.length}`;
    }

    // 鍵盤快捷鍵綁定
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowLeft") {
        markItem(false);
      } else if (e.code === "ArrowRight") {
        markItem(true);
      }
    });

    // 初始載入
    updateLessonOptions();
  </script>
</body>
</html>
